[project]
name = "kamaal-super-mind"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
]

[tool.uv]
package = false

[tool.pytest]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "PLW1510"]
